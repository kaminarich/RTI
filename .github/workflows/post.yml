name: Post Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (Example: v2.6)'
        required: true
        default: 'v2.6'
      versionCode:
        description: 'Version Code (Example: 26)'
        required: true
        default: '26'
      changelog:
        description: 'Release Changelog'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for committing and creating a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so the latest commit can be read and pushed
          lfs: true # Ensures real binary content is pulled if the repo uses Git LFS for assets like banners

      - name: Update module.prop
        run: |
          # Automatically update version & versionCode in module.prop
          sed -i "s/^version=.*/version=${{ github.event.inputs.version }}/g" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ github.event.inputs.versionCode }}/g" module.prop

      - name: Generate update.json (For Auto-Update)
        run: |
          # Automatically create/update the update.json file
          cat <<EOF > update.json
          {
            "version": "${{ github.event.inputs.version }}",
            "versionCode": ${{ github.event.inputs.versionCode }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/RTI-${{ github.event.inputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md"
          }
          EOF

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version to ${{ github.event.inputs.version }}"
          file_pattern: "module.prop update.json"

      - name: Create Module Zip
        run: |
          # Package all files into the zip, excluding git, github folders, and other zips
          zip -r9 RTI-${{ github.event.inputs.version }}.zip . -x "*.git*" -x ".github/*" -x "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: RTI ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: RTI-${{ github.event.inputs.version }}.zip

      - name: Send Telegram Notification
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          VERSION: ${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eo pipefail

          # Extract module name from module.prop
          MODULE_NAME=$(grep '^name=' module.prop | head -n1 | cut -d'=' -f2- | tr -d '\r' | xargs)

          # Extract banner file name from module.prop (strip CR and any stray whitespace/control chars)
          BANNER_FILE=$(grep '^banner=' module.prop | head -n1 | cut -d'=' -f2- | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          # Fallback if banner line is empty or missing
          if [ -z "$BANNER_FILE" ]; then
            BANNER_FILE="rti.webp"
          fi

          # Resolve to an absolute path so we validate and send the exact same file, no cwd ambiguity
          BANNER_PATH="$(pwd)/${BANNER_FILE}"

          echo "Detected module name: '$MODULE_NAME'"
          echo "Banner file to use: '$BANNER_FILE'"
          echo "Resolved banner path: '$BANNER_PATH'"

          # Get the last commit message (title only)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          SHORT_SHA=${SHA::7}

          # Construct the message caption (in English, no emojis)
          MESSAGE=$(cat <<EOF
          <b>${MODULE_NAME} Update</b>

          <b>Branch:</b> ${BRANCH}
          <b>Commit:</b> <a href="https://github.com/${REPO}/commit/${SHA}">${SHORT_SHA}</a> - ${COMMIT_MSG}
          <b>Compare:</b> <a href="https://github.com/${REPO}/commits/${BRANCH}">View Changes</a>
          <b>Workflow Run:</b> <a href="https://github.com/${REPO}/actions/runs/${RUN_ID}">View Log</a>
          <b>Release:</b> <a href="https://github.com/${REPO}/releases/tag/${VERSION}">Download ${VERSION}</a>
          EOF
          )

          # --- Diagnostics: confirm the file truly exists, is readable, and isn't a Git LFS pointer ---
          if [ ! -f "$BANNER_PATH" ]; then
            echo "Error: Image file '$BANNER_PATH' not found!"
            echo "Repository root contents:"
            ls -la "$(pwd)"
            exit 1
          fi

          echo "File info:"
          file "$BANNER_PATH" || true

          FILE_SIZE=$(stat -c '%s' "$BANNER_PATH")
          echo "File size: ${FILE_SIZE} bytes"
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "Warning: '$BANNER_PATH' is suspiciously small for an image."
            echo "This often means it's a Git LFS pointer file rather than the real banner."
            echo "First lines of the file for inspection:"
            head -c 300 "$BANNER_PATH"
            echo ""
          fi

          # Ensure the file is actually readable (fixes permission edge cases from checkout)
          chmod 644 "$BANNER_PATH" || true

          # --- TARGET CHANNELS ---
          # Define an array of target channel usernames
          CHATS=("@Kaminarich_HeavenlyArchive" "@Kaminarich_here")

          # Loop through each chat and send the notification
          for CHAT in "${CHATS[@]}"; do
            echo "Sending notification to $CHAT..."

            HTTP_CODE=$(curl -sS -o /tmp/tg_response.json -w "%{http_code}" -X POST "https://api.telegram.org/bot${TG_BOT}/sendPhoto" \
              --form-string "chat_id=$CHAT" \
              -F "photo=@${BANNER_PATH}" \
              --form-string "parse_mode=HTML" \
              --form-string "caption=$MESSAGE")

            echo "Telegram API HTTP status for $CHAT: $HTTP_CODE"
            cat /tmp/tg_response.json
            echo ""

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "Error: Telegram API request failed for $CHAT (see response body above)."
              exit 1
            fi
          done

          echo "All notifications sent successfully!"
