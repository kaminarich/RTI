name: Post Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (Example: v2.6)'
        required: true
        default: 'v2.6'
      versionCode:
        description: 'Version Code (Example: 26)'
        required: true
        default: '26'
      changelog:
        description: 'Release Changelog'
        required: true
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for committing and creating a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so the latest commit can be read and pushed

      - name: Update module.prop
        run: |
          # Automatically update version & versionCode in module.prop
          sed -i "s/^version=.*/version=${{ github.event.inputs.version }}/g" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ github.event.inputs.versionCode }}/g" module.prop

      - name: Generate update.json (For Auto-Update)
        run: |
          # Automatically create/update the update.json file
          cat <<EOF > update.json
          {
            "version": "${{ github.event.inputs.version }}",
            "versionCode": ${{ github.event.inputs.versionCode }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/RTI-${{ github.event.inputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md"
          }
          EOF

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version to ${{ github.event.inputs.version }}"
          file_pattern: "module.prop update.json"

      - name: Create Module Zip
        run: |
          # Package all files into the zip, excluding git, github folders, and other zips
          zip -r9 RTI-${{ github.event.inputs.version }}.zip . -x "*.git*" -x ".github/*" -x "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: RTI ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: RTI-${{ github.event.inputs.version }}.zip

      - name: Send Telegram Notification
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          VERSION: ${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Checking directory contents (for debugging)..."
          ls -la
          
          # Extract module name from module.prop (xargs is used to trim leading/trailing spaces)
          MODULE_NAME=$(grep '^name=' module.prop | cut -d'=' -f2- | tr -d '\r' | xargs)
          
          # Extract banner file name from module.prop
          BANNER_FILE=$(grep '^banner=' module.prop | cut -d'=' -f2- | tr -d '\r' | xargs)
          
          # Fallback if banner line is empty or missing
          if [ -z "$BANNER_FILE" ]; then
            BANNER_FILE="rti.webp"
          fi

          echo "Detected module name: '$MODULE_NAME'"
          echo "Banner file to use: '$BANNER_FILE'"

          # Get the last commit message (title only)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          SHORT_SHA=${SHA::7}
          
          # Construct the message caption (in English, no emojis)
          MESSAGE=$(cat <<EOF
          <b>${MODULE_NAME} Update</b>
          
          <b>Branch:</b> ${BRANCH}
          <b>Commit:</b> <a href="https://github.com/${REPO}/commit/${SHA}">${SHORT_SHA}</a> - ${COMMIT_MSG}
          <b>Compare:</b> <a href="https://github.com/${REPO}/commits/${BRANCH}">View Changes</a>
          <b>Workflow Run:</b> <a href="https://github.com/${REPO}/actions/runs/${RUN_ID}">View Log</a>
          <b>Release:</b> <a href="https://github.com/${REPO}/releases/tag/${VERSION}">Download ${VERSION}</a>
          EOF
          )

          # Use GitHub Actions absolute path to ensure curl finds the file
          FILE_PATH="$GITHUB_WORKSPACE/$BANNER_FILE"

          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: Image file '$FILE_PATH' not found during workflow execution!"
            exit 1
          fi

          echo "Sending notification to Telegram..."
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendPhoto" \
            -F chat_id="@Kaminarich_HeavenlyArchive" \
            -F photo="@${FILE_PATH}" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
