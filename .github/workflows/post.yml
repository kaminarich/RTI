name: Post Build and Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (Contoh: v2.6)'
        required: true
        default: 'v2.6'
      versionCode:
        description: 'Version Code (Contoh: 26)'
        required: true
        default: '26'
      changelog:
        description: 'Release Changelog (Catatan rilis)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dibutuhkan untuk commit dan membuat Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Mengambil seluruh riwayat agar komit terbaru dapat dibaca dan di-push

      - name: Update module.prop
        run: |
          # Otomatis mengubah version & versionCode di module.prop
          sed -i "s/^version=.*/version=${{ github.event.inputs.version }}/g" module.prop
          sed -i "s/^versionCode=.*/versionCode=${{ github.event.inputs.versionCode }}/g" module.prop

      - name: Generate update.json (For Auto-Update)
        run: |
          # Otomatis membuat/mengupdate file update.json
          cat <<EOF > update.json
          {
            "version": "${{ github.event.inputs.version }}",
            "versionCode": ${{ github.event.inputs.versionCode }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/RTI-${{ github.event.inputs.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/README.md"
          }
          EOF

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update version to ${{ github.event.inputs.version }}"
          file_pattern: "module.prop update.json"

      - name: Create Module Zip
        run: |
          # Memasukkan semua file ke dalam zip kecuali folder github dan zip lainnya
          zip -r9 RTI-${{ github.event.inputs.version }}.zip . -x "*.git*" -x ".github/*" -x "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: RTI ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: RTI-${{ github.event.inputs.version }}.zip

      - name: Send Telegram Notification
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          VERSION: ${{ github.event.inputs.version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Mengambil nama modul dari baris name= di module.prop (serta menghapus karakter carriage return jika ada)
          MODULE_NAME=$(grep '^name=' module.prop | cut -d'=' -f2- | tr -d '\r')

          # Mengambil pesan commit terakhir (judulnya saja)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          SHORT_SHA=${SHA::7}
          
          # Menyusun pesan (caption) bahasa Indonesia, mengambil MODULE_NAME secara dinamis
          MESSAGE=$(cat <<EOF
          <b>Pembaruan Modul ${MODULE_NAME}</b>
          
          <b>Cabang:</b> ${BRANCH}
          <b>Komit:</b> <a href="https://github.com/${REPO}/commit/${SHA}">${SHORT_SHA}</a> - ${COMMIT_MSG}
          <b>Bandingkan:</b> <a href="https://github.com/${REPO}/commits/${BRANCH}">Lihat Perubahan</a>
          <b>Log Eksekusi:</b> <a href="https://github.com/${REPO}/actions/runs/${RUN_ID}">Lihat Log</a>
          <b>Rilis:</b> <a href="https://github.com/${REPO}/releases/tag/${VERSION}">Unduh ${VERSION}</a>
          EOF
          )

          # Mengirim gambar rti.webp beserta caption menggunakan multipart/form-data (-F)
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT}/sendPhoto" \
            -F chat_id="@Kaminarich_HeavenlyArchive" \
            -F photo="@rti.webp" \
            -F parse_mode="HTML" \
            -F caption="$MESSAGE"
